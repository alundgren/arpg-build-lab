[project]
name = "arpg-build-lab"
version = "0.1.0"
description = "Inspect Last Epoch planner builds"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
arpg-import = "arpg_build_lab.importers.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arpg_build_lab"]
