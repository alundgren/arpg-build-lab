[project]
name = "arpg-build-lab"
version = "0.1.0"
description = "Inspect Last Epoch planner builds"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
arpg-import = "arpg_build_lab.importers.cli:main"
arpg-evaluate = "arpg_build_lab.cli:main"
arpg-dataset = "arpg_build_lab.datasets.cli:main"

[project.optional-dependencies]
calculator = ["lupa==2.8"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
