name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - name: Repository checks
        run: python scripts/check.py
      - name: Fetch pinned Last Epoch Building calculator
        run: |
          git clone --filter=blob:none --sparse https://github.com/uta666XYZ/LastEpochBuilding.git "$RUNNER_TEMP/last-epoch-building"
          git -C "$RUNNER_TEMP/last-epoch-building" checkout a97d388aca0da00907afb9d5a945c8f254a67b18
          git -C "$RUNNER_TEMP/last-epoch-building" sparse-checkout set src runtime
      - name: Install macOS LuaJIT build dependencies
        if: runner.os == 'macOS'
        run: brew install luajit pkg-config
      - name: Real calculator examples
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LUPA_NO_BUNDLE=true uv sync --locked --extra calculator --no-binary-package lupa --reinstall-package lupa
          else
            uv sync --locked --extra calculator
          fi
          uv run --no-sync python scripts/check_real_engine.py --leb-checkout "$RUNNER_TEMP/last-epoch-building"
